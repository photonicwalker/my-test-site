<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>湊十：記憶翻牌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Rubik:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7edf4; --ink:#1c2a3e; --muted:#5b6b80;
  --felt:#23456e; --felt-edge:#17314f;
  --tile:#f6efdb; --tile-edge:#d6c79f;
  --back:#d99a2b; --back-dark:#b87d17;
  --red:#c42f28; --green:#17804a;
  --ring:#ffffff; --hint:#f2c230;
  --btn:#1c2a3e; --btn-ink:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101c2c; --ink:#eef2f7; --muted:#9aabc0;
    --felt:#23456e; --felt-edge:#0c1a2b;
    --btn:#f6efdb; --btn-ink:#1c2a3e;
  }
}
:root[data-theme="dark"]{
  --bg:#101c2c; --ink:#eef2f7; --muted:#9aabc0;
  --felt:#23456e; --felt-edge:#0c1a2b;
  --btn:#f6efdb; --btn-ink:#1c2a3e;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  display:flex; justify-content:center;
}
main{width:min(100%,520px); padding:24px 16px 40px; display:flex; flex-direction:column; align-items:center; gap:16px}
header{width:100%; display:flex; align-items:flex-end; justify-content:space-between; gap:12px}
h1{margin:0; font-size:clamp(34px,9vw,48px); font-weight:900; line-height:1; letter-spacing:.02em}
h1 small{display:block; font-size:15px; font-weight:700; color:var(--muted); margin-top:6px; letter-spacing:0}
.legend{font-size:15px; line-height:1.6; text-align:right}
.legend b{font-family:Rubik,sans-serif; font-size:18px}
.legend .g{color:var(--green)} .legend .r{color:var(--red)}

.stats{width:100%; display:flex; gap:8px}
.stat{flex:1; min-width:0; border:1.5px solid color-mix(in srgb,var(--ink) 18%,transparent); border-radius:10px; padding:8px 10px}
.stat span{display:block; font-size:12px; color:var(--muted)}
.stat strong{font-family:Rubik,"Noto Sans TC",sans-serif; font-size:clamp(16px,4.6vw,22px); white-space:nowrap}

.stage{width:min(92vw,440px); display:flex; flex-direction:column; gap:10px}
.board{
  width:100%; aspect-ratio:1; display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr);
  gap:clamp(6px,2vw,11px); padding:clamp(10px,3vw,16px);
  background:var(--felt); border-radius:24px;
  box-shadow:inset 0 0 0 3px var(--felt-edge), 0 10px 0 var(--felt-edge);
}
.card{border:0; padding:0; background:none; cursor:pointer; perspective:700px; border-radius:12px; font:inherit; color:inherit; transition:transform .15s}
.card:disabled{cursor:default}
.card:focus-visible{outline:3px dashed var(--hint); outline-offset:3px}
.card.sel{transform:translateY(-4px); outline:3px solid var(--ring); outline-offset:3px}
.inner{position:relative; display:block; width:100%; height:100%; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.5,0,.3,1)}
.card.down .inner{transform:rotateY(180deg)}
.face{position:absolute; inset:0; border-radius:12px; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:grid; place-items:center}
.front{
  background:var(--tile); box-shadow:inset 0 -5px 0 var(--tile-edge);
  font-family:Rubik,sans-serif; font-weight:800; font-size:clamp(30px,10vw,52px); padding-bottom:4px;
}
.front i{position:absolute; top:4px; left:8px; font-style:normal; font-size:clamp(12px,3.4vw,16px); opacity:.7}
.plus{color:var(--green)} .minus{color:var(--red)}
.back{
  transform:rotateY(180deg);
  background:
    radial-gradient(circle at 50% 50%, transparent 38%, rgba(255,255,255,.18) 39% 43%, transparent 44%),
    repeating-linear-gradient(45deg, var(--back) 0 7px, var(--back-dark) 7px 9px);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.18);
}
.card.hint .front{box-shadow:inset 0 -5px 0 var(--tile-edge), inset 0 0 0 4px var(--hint)}
.card.dim .front{opacity:.45}

.timer{height:8px; border-radius:8px; background:color-mix(in srgb,var(--ink) 12%,transparent); overflow:hidden}
.timer span{display:block; height:100%; width:0; background:var(--back)}
.msg{min-height:3.2em; text-align:center; font-size:17px; font-weight:700; line-height:1.6; margin:0}
.msg .sub{display:block; font-weight:400; font-size:14px; color:var(--muted)}

#main{
  min-width:200px; border:0; border-radius:14px; padding:14px 28px; font:900 19px "Noto Sans TC",sans-serif;
  background:var(--btn); color:var(--btn-ink); cursor:pointer; box-shadow:0 4px 0 color-mix(in srgb,var(--btn) 60%,#000);
}
#main:active{transform:translateY(2px); box-shadow:0 2px 0 color-mix(in srgb,var(--btn) 60%,#000)}
#main:disabled{opacity:.4; cursor:default}
#main:focus-visible{outline:3px dashed var(--hint); outline-offset:3px}

.settings{width:100%; display:flex; flex-wrap:wrap; gap:10px 18px; justify-content:center; font-size:14px; color:var(--muted)}
.settings label{display:flex; align-items:center; gap:6px}
.settings select{font:inherit; color:var(--ink); background:var(--bg); border:1.5px solid color-mix(in srgb,var(--ink) 25%,transparent); border-radius:8px; padding:4px 6px}

@media (prefers-reduced-motion: reduce){
  .inner,.card{transition:none}
}
</style>
</head>
<body>
<main>
  <header>
    <h1>湊十<small>記住數字，蓋牌轉向後找回來</small></h1>
    <div class="legend"><span class="g"><b>7</b> 綠字加</span><br><span class="r"><b>7</b> 紅字減</span></div>
  </header>

  <div class="stats">
    <div class="stat"><span>關卡</span><strong id="lvl">1</strong></div>
    <div class="stat"><span>記憶時間</span><strong id="mem">5 秒</strong></div>
    <div class="stat"><span>可翻牌數</span><strong id="rule">不限</strong></div>
    <div class="stat"><span>最佳紀錄</span><strong id="best">–</strong></div>
  </div>

  <div class="stage">
    <div class="board" id="board" aria-label="4 乘 4 牌面"></div>
    <div class="timer" aria-hidden="true"><span id="bar"></span></div>
  </div>

  <p class="msg" id="msg" aria-live="polite">按「開始」看牌。牌會在幾秒後蓋起來並旋轉 90°。<span class="sub">蓋牌後點選牌，讓加減後的總和剛好等於 10。第 3 關起只能翻固定張數，而且只有一組答案。</span></p>

  <button id="main" type="button">開始</button>

  <div class="settings">
    <label>旋轉方向
      <select id="dir">
        <option value="cw">順時針</option>
        <option value="ccw">逆時針</option>
        <option value="rand">隨機</option>
      </select>
    </label>
    <label><input type="checkbox" id="reveal" checked> 翻牌時顯示數字與總和</label>
  </div>
</main>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const board = $('#board'), bar = $('#bar'), msg = $('#msg'), mainBtn = $('#main');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = n => Math.floor(Math.random() * n);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  let cells = [], phase = 'idle', level = 1, timers = [], raf = 0, round = { k: 0 }, used = 0;
  let best = 0;
  try { best = parseInt(localStorage.getItem('make10-best') || '0', 10) || 0; } catch (e) {}

  // 關卡難度：k = 本關只能翻幾張（0 = 不限張數、可能多組答案）
  function cfg(lv) {
    if (lv <= 2) return { k: 0, mem: 5.5 - lv * 0.5 };                 // 5, 4.5 秒
    if (lv <= 4) return { k: 2, mem: 5 };                               // 翻 2 張，唯一解
    if (lv <= 7) return { k: 3, mem: 5 - (lv - 5) * 0.5 };              // 翻 3 張，含紅字
    return { k: 4, mem: Math.max(2.5, 5 - (lv - 8) * 0.5) };           // 翻 4 張，時間遞減
  }

  const later = (ms, fn) => timers.push(setTimeout(fn, ms));
  const clearAll = () => { timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf); };
  const setMsg = (main, sub = '') => { msg.innerHTML = main + (sub ? `<span class="sub">${sub}</span>` : ''); };

  function updateStats() {
    const c = cfg(level);
    $('#lvl').textContent = level;
    $('#mem').textContent = c.mem + ' 秒';
    $('#rule').textContent = c.k ? c.k + ' 張' : '不限';
    $('#best').textContent = best ? '第 ' + best + ' 關' : '–';
  }

  // ---------- 出題 ----------
  function combos(n, k) {
    const out = [];
    const rec = (st, cur) => {
      if (cur.length === k) { out.push(cur.slice()); return; }
      for (let i = st; i < n; i++) { cur.push(i); rec(i + 1, cur); cur.pop(); }
    };
    rec(0, []);
    return out;
  }
  const COMBOS = {}, BY_INDEX = {};
  [2, 3, 4].forEach(k => {
    COMBOS[k] = combos(16, k);
    BY_INDEX[k] = Array.from({ length: 16 }, (_, i) => COMBOS[k].filter(c => c.includes(i)));
  });

  const randItem = () => ({ v: 1 + rand(9), s: Math.random() < 0.35 ? -1 : 1 });

  // 自由模式：找出最少張數的一組解（提示用）
  function findSolution(items) {
    let bestMask = -1, bestCount = 99;
    for (let m = 1; m < (1 << 16); m++) {
      let sum = 0, cnt = 0;
      for (let i = 0; i < 16; i++) if (m & (1 << i)) { sum += items[i].s * items[i].v; cnt++; }
      if (sum === 10 && cnt < bestCount) { bestCount = cnt; bestMask = m; if (cnt === 2) break; }
    }
    return bestMask;
  }

  function generateFree() {
    let items;
    do { items = Array.from({ length: 16 }, randItem); } while (findSolution(items) < 0);
    return items;
  }

  // 答案位置：任兩張不相鄰（上下左右與斜角都不相連）
  function farPositions(k) {
    for (let t = 0; t < 200; t++) {
      const pos = [];
      for (const p of shuffle([...Array(16).keys()])) {
        const ok = pos.every(q => Math.max(Math.abs((p >> 2) - (q >> 2)), Math.abs((p & 3) - (q & 3))) >= 2);
        if (ok) { pos.push(p); if (pos.length === k) return pos; }
      }
    }
    return null;
  }

  function answerValues(k, needRed) {
    for (;;) {
      const vals = []; let sum = 0;
      for (let i = 0; i < k - 1; i++) { const it = randItem(); vals.push(it); sum += it.s * it.v; }
      const last = 10 - sum;
      if (last === 0 || Math.abs(last) > 9) continue;
      vals.push({ v: Math.abs(last), s: last > 0 ? 1 : -1 });
      if (needRed && !vals.some(x => x.s < 0)) continue;
      return shuffle(vals);
    }
  }

  // 限定翻 k 張：保證所有 k 張組合中，只有答案那一組總和為 10
  function generateUnique(k) {
    const all = COMBOS[k], byIdx = BY_INDEX[k];
    for (let attempt = 0; attempt < 80; attempt++) {
      const pos = farPositions(k);
      if (!pos) continue;
      const items = Array.from({ length: 16 }, randItem);
      const isAns = new Array(16).fill(false);
      answerValues(k, k >= 3).forEach((it, i) => { items[pos[i]] = it; isAns[pos[i]] = true; });
      const isBad = c => c.reduce((a, j) => a + items[j].s * items[j].v, 0) === 10 && !c.every(j => isAns[j]);

      for (let step = 0; step < 300; step++) {
        const bad = all.filter(isBad);
        if (!bad.length) return items.map((it, i) => ({ ...it, ans: isAns[i] }));
        const c = bad[rand(bad.length)];
        const cand = c.filter(j => !isAns[j]);
        const i = cand[rand(cand.length)];
        let low = Infinity, opts = [];
        for (const s of [1, -1]) for (let v = 1; v <= 9; v++) {
          items[i] = { v, s };
          const n = byIdx[i].filter(isBad).length;
          if (n < low) { low = n; opts = [{ v, s }]; } else if (n === low) opts.push({ v, s });
        }
        items[i] = opts[rand(opts.length)];
      }
    }
    return null;
  }

  // ---------- 畫面 ----------
  function build(items, faceDown) {
    board.innerHTML = '';
    cells = items.map(it => {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'card' + (faceDown ? ' down' : '');
      el.disabled = true;
      el.innerHTML = `<span class="inner"><span class="face front ${it.s > 0 ? 'plus' : 'minus'}"><i>${it.s > 0 ? '+' : '−'}</i>${it.v}</span><span class="face back"></span></span>`;
      const cell = { el, v: it.v, s: it.s, ans: !!it.ans, sel: false };
      el.addEventListener('click', () => pick(cell));
      board.appendChild(el);
      return cell;
    });
    labelCells();
  }

  function labelCells() {
    cells.forEach((c, i) => {
      const pos = `第 ${(i >> 2) + 1} 列第 ${(i & 3) + 1} 格`;
      const faceUp = !c.el.classList.contains('down');
      c.el.setAttribute('aria-label', faceUp ? `${pos}，${c.s > 0 ? '綠色加' : '紅色減'} ${c.v}` : `${pos}，蓋著`);
      c.el.setAttribute('aria-pressed', c.sel ? 'true' : 'false');
    });
  }

  function ruleText() {
    return round.k ? `本關只能翻 ${round.k} 張，而且只有一組答案，翻了就不能收回。` : '本關不限張數，湊到 10 就過關。';
  }

  // ---------- 流程 ----------
  function startRound() {
    clearAll();
    const c = cfg(level);
    let items = c.k ? generateUnique(c.k) : null;
    round = { k: items ? c.k : 0, mem: c.mem };
    if (!items) items = generateFree();
    used = 0;
    phase = 'memorize';
    updateStats();
    build(items, false);
    mainBtn.disabled = false;
    mainBtn.textContent = '我已記住';
    const total = round.mem * 1000;
    const t0 = performance.now();
    const tick = now => {
      const left = Math.max(0, total - (now - t0));
      bar.style.width = (left / total * 100) + '%';
      setMsg(`記住它們！還剩 ${Math.ceil(left / 1000)} 秒`, ruleText());
      if (left > 0) raf = requestAnimationFrame(tick); else hideCards();
    };
    raf = requestAnimationFrame(tick);
  }

  function hideCards() {
    phase = 'hiding';
    mainBtn.disabled = true;
    mainBtn.textContent = '蓋牌中…';
    bar.style.width = '0';
    cells.forEach(c => c.el.classList.add('down'));
    labelCells();
    setMsg('蓋牌！');
    later(reduce ? 80 : 600, rotateBoard);
  }

  function rotateBoard() {
    const choice = $('#dir').value;
    const dir = choice === 'cw' ? 1 : choice === 'ccw' ? -1 : (Math.random() < .5 ? 1 : -1);
    setMsg(dir > 0 ? '牌面順時針轉 90°' : '牌面逆時針轉 90°');
    const dur = reduce ? 0 : 900;
    board.style.transition = `transform ${dur}ms cubic-bezier(.6,0,.3,1)`;
    board.style.transform = `rotate(${dir * 90}deg)`;
    later(dur + 80, () => {
      board.style.transition = 'none';
      board.style.transform = 'none';
      const next = new Array(16);
      cells.forEach((c, i) => {
        const r = i >> 2, col = i & 3;
        const [nr, nc] = dir > 0 ? [col, 3 - r] : [3 - col, r];
        next[nr * 4 + nc] = c;
      });
      cells = next;
      cells.forEach(c => board.appendChild(c.el));
      void board.offsetWidth;
      board.style.transition = '';
      startPlay();
    });
  }

  function startPlay() {
    phase = 'play';
    cells.forEach(c => { c.el.disabled = false; });
    labelCells();
    updateSum();
    cells[0].el.focus({ preventScroll: true });
  }

  function pick(c) {
    if (phase !== 'play') return;
    const reveal = $('#reveal').checked;
    if (round.k) {
      if (c.sel) return;                         // 限翻模式：翻了不能收回
      c.sel = true; used++;
      c.el.classList.add('sel');
      if (reveal) c.el.classList.remove('down');
      labelCells();
      updateSum();
      if (used === round.k) { phase = 'judging'; later(reduce ? 0 : 700, finish); }
      return;
    }
    c.sel = !c.sel;
    c.el.classList.toggle('sel', c.sel);
    if (reveal) c.el.classList.toggle('down', !c.sel);
    labelCells();
    updateSum();
  }

  const currentSum = () => cells.filter(c => c.sel).reduce((a, c) => a + c.s * c.v, 0);

  function updateSum() {
    const n = cells.filter(c => c.sel).length;
    const reveal = $('#reveal').checked;
    if (round.k) {
      const left = round.k - used;
      mainBtn.disabled = true;
      mainBtn.textContent = left ? `還能翻 ${left} 張` : '判定中…';
      if (n === 0) { setMsg(`只能翻 ${round.k} 張，選準了再點`, '這一關只有一組答案，翻了就不能收回。'); return; }
      setMsg(reveal ? `目前總和：${currentSum()}` : `已翻 ${n} 張`, left ? `還能翻 ${left} 張` : '');
      return;
    }
    mainBtn.textContent = '確認答案';
    mainBtn.disabled = n === 0;
    if (n === 0) { setMsg('點選牌，讓總和剛好等於 10', '再點一次可以取消選取。'); return; }
    if (reveal) {
      const s = currentSum();
      setMsg(`目前總和：${s}`, s === 10 ? '剛好 10，按「確認答案」過關。' : `已選 ${n} 張`);
    } else {
      setMsg(`已選 ${n} 張`, '選好後按「確認答案」。');
    }
  }

  function finish() {
    phase = 'done';
    const sum = currentSum();
    cells.forEach(c => { c.el.disabled = true; c.el.classList.remove('down'); });
    if (sum === 10) {
      if (level > best) { best = level; try { localStorage.setItem('make10-best', String(best)); } catch (e) {} }
      const nx = cfg(level + 1), cur = cfg(level);
      let sub = `下一關記憶時間 ${nx.mem} 秒。`;
      if (nx.k !== cur.k) sub = `下一關開始只能翻 ${nx.k} 張，而且只有一組答案。`;
      setMsg('過關！總和剛好 10', sub);
      level++;
      mainBtn.textContent = '下一關';
    } else {
      let isHint;
      if (round.k) isHint = c => c.ans;
      else { const mask = findSolution(cells); isHint = c => !!(mask & (1 << cells.indexOf(c))); }
      cells.forEach(c => {
        if (isHint(c)) c.el.classList.add('hint');
        else if (!c.sel) c.el.classList.add('dim');
      });
      setMsg(`總和是 ${sum}，不是 10`, round.k ? '黃框是本關唯一的答案。' : '黃框是其中一種湊到 10 的組合。');
      mainBtn.textContent = '再試一次';
    }
    labelCells();
    updateStats();
    mainBtn.disabled = false;
    mainBtn.focus({ preventScroll: true });
  }

  mainBtn.addEventListener('click', () => {
    if (phase === 'memorize') { clearAll(); hideCards(); }
    else if (phase === 'play') finish();
    else if (phase === 'idle' || phase === 'done') startRound();
  });

  updateStats();
  build(generateFree(), true);
})();
</script>
</body>
</html>
